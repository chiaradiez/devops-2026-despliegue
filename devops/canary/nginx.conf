worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    log_format canary '$remote_addr - [$time_local] "$request" $status '
                      'upstream=$upstream_addr version=$upstream_http_x_app_version';
    access_log /var/log/nginx/access.log canary;
    error_log  /var/log/nginx/error.log warn;

    # Este archivo contiene el upstream activo (100/0, 90/10, 50/50 o 0/100).
    include /etc/nginx/canary/upstream.conf;

    upstream canary_api {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://canary_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://canary_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Nginx propaga la cabecera entregada por el frontend seleccionado.
            proxy_pass_header X-App-Version;
        }
    }
}
