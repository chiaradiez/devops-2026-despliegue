server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-App-Version "v2" always;

    location / {
        try_files $uri $uri/ /index.html;

        sub_filter_types text/html;
        sub_filter '__SERVER_REPLICA_ID__' '$hostname';
        sub_filter '</body>' '<div style="position:fixed;top:12px;left:12px;z-index:1000;padding:6px 10px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(51,51,51,.85);color:#fff;font:600 12px sans-serif;letter-spacing:.04em">CoffeeQueue V2 - Canary</div></body>';
        sub_filter_once off;
    }
}
