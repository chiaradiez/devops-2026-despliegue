name: coffeequeue-canary

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./weights/active.conf:/etc/nginx/canary/upstream.conf:ro
    depends_on:
      - front_v1
      - front_v2
      - api
    networks:
      - canary
    restart: unless-stopped

  front_v1:
    build:
      context: ../../front
    volumes:
      - ./front-v1.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - canary
    restart: unless-stopped

  front_v2:
    build:
      context: ../../front
    volumes:
      - ./front-v2.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - canary
    restart: unless-stopped

  api:
    build:
      context: ../../api
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      PORT: "3000"
    depends_on:
      - redis
    expose:
      - "3000"
    networks:
      - canary
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --protected-mode no --appendonly yes
    expose:
      - "6379"
    volumes:
      - canary-redis-data:/data
    networks:
      - canary
    restart: unless-stopped

networks:
  canary:
    name: coffeequeue-canary-network

volumes:
  canary-redis-data:
    name: coffeequeue-canary-redis-data
